name: Spotriq deployed-source security profile

queries:
  - uses: security-extended

# Verification scripts and tests intentionally contain synthetic hostile URLs, IDs,
# fixtures and failure strings. They are not deployed by Railway or Vercel, so keep
# CodeQL focused on production application/package source rather than test fixtures.
paths-ignore:
  - 'scripts/**'
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - 'artifacts/**'
